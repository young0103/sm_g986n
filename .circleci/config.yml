version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ── 1. Build prerequisites ───────────────────────────────
      - run:
          name: Install build prerequisites
          command: |
            set -eux
            apt-get update -y
            # python3 심볼릭 링크까지 포함
            apt-get install -y \
              build-essential bc git curl lz4 cpio flex bison rsync zstd \
              libncurses-dev libssl-dev python-is-python3

      # ── 2. Neutron‑Clang (portable glibc) ────────────────────
      - run:
          name: Fetch Neutron‑Clang (+glibc 2.38)
          command: |
            set -eux
            TC=$HOME/toolchains/neutron-clang
            mkdir -p "$TC" && cd "$TC"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo "export PATH=$TC/bin:\$PATH" >> "$BASH_ENV"

      # ── 3. Kernel build ──────────────────────────────────────
      - run:
          name: Build y2q (SM‑G986N) kernel
          command: |
            set -eux
            source "$BASH_ENV"

            # Android‑style cross 프리픽스 사용 (Neutron toolchain 안에 모두 포함)
            export CROSS_COMPILE=aarch64-linux-android-
            export CROSS_COMPILE_COMPAT=arm-linux-androideabi-

            OUT=$PWD/out

            # ① defconfig
            make -C $PWD O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 vendor/y2q_kor_singlex_defconfig

            # ② olddefconfig (비‑대화식, python 문제 해결됐으므로 OK)
            make -C $PWD O=$OUT olddefconfig

            # ③ full build
            make -C $PWD -j"$(nproc)" O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
                 AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
                 OBJDUMP=llvm-objdump STRIP=llvm-strip \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
                 HOSTCC=gcc HOSTCXX=g++

      # ── 4. Artifacts ─────────────────────────────────────────
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
