version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ───────────────────────── 1. 의존 패키지 ─────────────────────────
      - run:
          name: Install prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python3 python-is-python3 \
              lz4 cpio flex bison zstd rsync \
              libncurses-dev libssl-dev \
              binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      # ───────────────── 2. Neutron‑Clang + 휴대용 GLIBC ────────────────
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC" && cd "$TC"
            curl -sLo antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo "export PATH=$TC/bin:\$PATH" >> "$BASH_ENV"

      # ───────────────────── 3. 커널 빌드 (one‑shot) ─────────────────────
      - run:
          name: Build kernel
          command: |
            set -eux
            source "$BASH_ENV"
      
            # --- 크로스 binutils를 가장 앞에 배치 ------------------
            export PATH="/usr/aarch64-linux-gnu/bin:/usr/arm-linux-gnueabi/bin:$PATH"
      
            OUT=$PWD/out
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
      
            # 1) defconfig
            make O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 vendor/y2q_kor_singlex_defconfig
      
            # 2) full build
            make -j"$(nproc)" O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
                 HOSTCC=gcc HOSTCXX=g++

      # ───────────────────────── 4. 결과물 ─────────────────────────────
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel

