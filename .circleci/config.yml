# ====================================================================
#  Samsung Galaxy S20+ (SM‑G986N) 커널 — Neutron 18 자동 빌드 파이프라인
# ====================================================================

version: 2.1
executors:
  kernel-exec:
    docker: [{image: cimg/base:stable}]
    environment:
      TZ: Etc/UTC
      DEBIAN_FRONTEND: noninteractive

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout
      # ------------------------------------------------
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential bc bison flex libssl-dev \
              dwarves git curl xz-utils python3
      # -------------- fetch toolchain -----------------
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC_DIR=$HOME/toolchains/neutron-clang
            mkdir -p "$TC_DIR" && cd "$TC_DIR"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable        # or "-S latest"
            echo 'export PATH=$HOME/toolchains/neutron-clang/bin:$PATH' >> $BASH_ENV
      # -------------- build kernel --------------------
      - run:
          name: Build y2q kernel
          command: |
            set -eux
            source $BASH_ENV
            cd kernel                              # repo root you checked‑out
            export ARCH=arm64 LLVM=1 CC=clang
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            make vendor/y2q_kor_singlex_defconfig
            make -j"$(nproc)"
      # -------------- artifacts -----------------------
      - store_artifacts:
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:

      - build-kernel
