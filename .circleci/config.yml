version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable      # Ubuntu 20.04
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      # 0) 소스
      - checkout

      # 1) 호스트용 필수 패키지 + 크로스 binutils
      - run:
          name: Install prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python-is-python3 \
              lz4 cpio flex bison zstd \
              libncurses-dev libssl-dev \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      # 2) Neutron‑Clang (LLVM 17계열) + 휴대용 glibc 2.38
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC" && cd "$TC"

            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable          # clang/LLVM/binutils
            ./antman --patch=glibc      # portable glibc 2.38

            echo "export PATH=$TC/bin:\$PATH" >> "$BASH_ENV"

      # 3) 커널 빌드 (Arm64 + 32‑bit compat)
      - run:
          name: Build Galaxy S20+ kernel
          command: |
            set -eux
            source "$BASH_ENV"

            OUT=$PWD/out
            NPROC=$(nproc)

            # 공통 플래그
            COMMON="O=$OUT ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                     CC=clang LD=ld.lld \
                     CLANG_TRIPLE=aarch64-linux-gnu \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-"

            # ① defconfig
            make $COMMON vendor/y2q_kor_singlex_defconfig

            # ② 전체 빌드 (host 툴체인은 gcc)
            make -j$NPROC $COMMON HOSTCC=gcc HOSTCXX=g++

      # 4) 결과물
      - store_artifacts:
          path:       out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
