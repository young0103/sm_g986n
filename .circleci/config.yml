# .circleci/config.yml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable      # Ubuntu 20.04 LTS
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ────────────────────────────────────────
      # 1) 필수 패키지 설치
      # ────────────────────────────────────────
      - run:
          name: Install prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python-is-python3 \
              lz4 cpio flex bison zstd \
              libncurses-dev libssl-dev \
              gcc-aarch64-linux-gnu  binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi  binutils-arm-linux-gnueabi

      # ────────────────────────────────────────
      # 2) Neutron‑Clang + glibc 2.38 패치
      # ────────────────────────────────────────
      - run:
          name: Fetch Neutron‑Clang toolchain
          command: |
            set -eux
            TC_DIR="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC_DIR" && cd "$TC_DIR"

            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman

            ./antman -S stable          # 클랭 + LLVM binutils
            ./antman --patch=glibc      # 휴대용 glibc 2.38 추가

            echo "export PATH=$TC_DIR/bin:\$PATH" >> "$BASH_ENV"

      # ────────────────────────────────────────
      # 3) 커널 빌드 (make 호출마다 변수 직접 지정)
      # ────────────────────────────────────────
      - run:
          name: Build Galaxy S20+ kernel
          command: |
            set -eux
            source "$BASH_ENV"

            # ① ARM cross‑binutils를 PATH 맨 앞에
            export PATH="/usr/aarch64-linux-gnu/bin:/usr/arm-linux-gnueabi/bin:$PATH"

            OUT=$PWD/out
            MFLAGS="O=$OUT ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                    CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
                    CROSS_COMPILE=aarch64-linux-gnu- \
                    CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                    HOSTCC=gcc HOSTCXX=g++"

            make $MFLAGS mrproper
            make $MFLAGS vendor/y2q_kor_singlex_defconfig
            make -j$(nproc) $MFLAGS

      # ────────────────────────────────────────
      # 4) 결과물 저장
      # ────────────────────────────────────────
      - store_artifacts:
          path:       out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel

