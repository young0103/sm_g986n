version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable     # Ubuntu 20.04 LTS
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      # 0) 소스
      - checkout

      # 1) 호스트 의존 패키지
      - run:
          name: Install prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python-is-python3 \
              lz4 cpio flex bison zstd \
              libncurses-dev libssl-dev \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      # 2) Neutron‑Clang + portable glibc
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC_DIR="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC_DIR" && cd "$TC_DIR"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo "export PATH=$TC_DIR/bin:\$PATH" >> "$BASH_ENV"

      # 3) 커널 빌드
      - run:
          name: Build Galaxy S20+ kernel
          command: |
            set -eux
            source "$BASH_ENV"

            OUT=$PWD/out
            NPROC=$(nproc)

            # ── ① defconfig
            make O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC=clang LD=ld.lld \
                 CLANG_TRIPLE=aarch64-linux-gnu \        # ← 대시(‑) 없음
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
                 vendor/y2q_kor_singlex_defconfig

            # ── ② full build
            make -j$NPROC O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC=clang LD=ld.lld \
                 CLANG_TRIPLE=aarch64-linux-gnu \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
                 HOSTCC=gcc HOSTCXX=g++

      # 4) 결과물 저장
      - store_artifacts:
          path:       out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
