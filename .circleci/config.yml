version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout
      - run:
          name: Install packages
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python-is-python3 \
              lz4 cpio flex bison zstd libncurses-dev libssl-dev \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC" && cd "$TC"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo "export PATH=$TC/bin:\$PATH" >> $BASH_ENV
      - run:
          name: Build kernel
          command: |
            set -eux
            source "$BASH_ENV"
            OUT=$PWD/out
            NCPU=$(nproc)

            # 한 줄에 모든 변수 지정
            make -C $PWD O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC="clang --target=aarch64-linux-gnu --prefix=/usr/aarch64-linux-gnu/bin/" \
                 LD=ld.lld \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                 vendor/y2q_kor_singlex_defconfig

            make -C $PWD -j$NCPU O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC="clang --target=aarch64-linux-gnu --prefix=/usr/aarch64-linux-gnu/bin/" \
                 LD=ld.lld \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
