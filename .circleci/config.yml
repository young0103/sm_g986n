version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable     # Ubuntu 20.04
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      # 0) 소스
      - checkout

      # 1) 호스트 의존 패키지
      - run:
          name: Host prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python-is-python3 \
              lz4 cpio flex bison zstd libncurses-dev libssl-dev

      # 2) Linaro 2023.09 binutils / gcc (framework 만 필요)
      - run:
          name: Get Linaro cross‑binutils (2023.09)
          command: |
            set -eux
            BASE=https://releases.linaro.org/components/toolchain/binaries/13.2-2023.09
            mkdir -p $HOME/.tc
            curl -sL $BASE/aarch64-linux-gnu/gcc-linaro-13.2.1-2023.09-x86_64_aarch64-linux-gnu.tar.xz \
                 | tar -xJ -C $HOME/.tc
            curl -sL $BASE/arm-linux-gnueabihf/gcc-linaro-13.2.1-2023.09-x86_64_arm-linux-gnueabihf.tar.xz \
                 | tar -xJ -C $HOME/.tc

            echo 'export PATH=$HOME/.tc/gcc-linaro-13.2.1-2023.09-x86_64_aarch64-linux-gnu/bin:$HOME/.tc/gcc-linaro-13.2.1-2023.09-x86_64_arm-linux-gnueabihf/bin:$PATH' >> $BASH_ENV

      # 3) Neutron‑Clang (stable) + glibc patch
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC=$HOME/toolchains/neutron-clang
            mkdir -p $TC && cd $TC
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo "export PATH=$TC/bin:\$PATH" >> $BASH_ENV

      # 4) 커널 빌드
      - run:
          name: Build Galaxy S20+ kernel
          command: |
            set -eux
            source $BASH_ENV
            OUT=$PWD/out
            N=$(nproc)

            # defconfig
            make O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC=clang LD=ld.lld \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
                 vendor/y2q_kor_singlex_defconfig

            # full build
            make -j$N O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC=clang LD=ld.lld \
                 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabihf- \
                 HOSTCC=gcc HOSTCXX=g++

      # 5) 결과물
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
