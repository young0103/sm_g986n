# .circleci/config.yml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable    # Ubuntu 20.04 LTS
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
    # 0) 소스 가져오기 -------------------------------------------------------
    - checkout

    # 1) 호스트 빌드 툴 설치 --------------------------------------------------
    - run:
        name: Install host‑side prerequisites
        command: |
          apt-get update -y
          apt-get install -y \
            build-essential bc git curl python-is-python3 \
            lz4 cpio flex bison zstd libncurses-dev libssl-dev

    # 2) Arm GNU Toolchain 13.2 (aarch64 & armhf) ----------------------------
    - run:
        name: Get Arm GNU Toolchain 13.2 (2023‑rel1)
        command: |
          set -eux
          dst="$HOME/toolchains/arm"
          mkdir -p "$dst"
          
          base="https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1"
          a64="gcc-arm-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          arm="gcc-arm-13.2.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz"

          curl -sSL "$base/$a64" | tar -xJ -C "$dst"
          curl -sSL "$base/$arm" | tar -xJ -C "$dst"

          # PATH 맨 앞에 추가
          echo "export PATH=$dst/gcc-arm-13.2.rel1-x86_64-aarch64-none-linux-gnu/bin:$dst/gcc-arm-13.2.rel1-x86_64-arm-none-linux-gnueabihf/bin:\$PATH" >> "$BASH_ENV"

    # 3) Neutron‑Clang --------------------------------------------------------
    - run:
        name: Fetch Neutron‑Clang (with portable glibc 2.38)
        command: |
          set -eux
          tc="$HOME/toolchains/neutron-clang"
          mkdir -p "$tc" && cd "$tc"
          curl -sSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          ./antman -S stable
          ./antman --patch=glibc
          echo "export PATH=$tc/bin:\$PATH" >> "$BASH_ENV"

    # 4) 커널 빌드 ------------------------------------------------------------
    - run:
        name: Build Galaxy S20+ (y2q) kernel
        command: |
          set -eux
          source "$BASH_ENV"

          OUT=$PWD/out
          NPROC=$(nproc)

          # ── defconfig
          make O=$OUT                               \
               ARCH=arm64 LLVM=1 LLVM_IAS=1         \
               CC=clang LD=ld.lld                   \
               CLANG_TRIPLE=aarch64-none-linux-gnu- \
               CROSS_COMPILE=aarch64-none-linux-gnu-\
               CROSS_COMPILE_COMPAT=arm-none-linux-gnueabihf- \
               vendor/y2q_kor_singlex_defconfig

          # ── full build
          make -j$NPROC  O=$OUT                     \
               ARCH=arm64 LLVM=1 LLVM_IAS=1         \
               CC=clang LD=ld.lld                   \
               CLANG_TRIPLE=aarch64-none-linux-gnu- \
               CROSS_COMPILE=aarch64-none-linux-gnu-\
               CROSS_COMPILE_COMPAT=arm-none-linux-gnueabihf- \
               AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump STRIP=llvm-strip \
               HOSTCC=gcc HOSTCXX=g++

    # 5) 결과물 보존 ----------------------------------------------------------
    - store_artifacts:
        path:       out/arch/arm64/boot/Image.gz-dtb
        destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
