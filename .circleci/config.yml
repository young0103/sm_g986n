# .circleci/config.yml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable   # Ubuntu 20.04 LTS (focal) 기반
        user: root               # 패키지 설치를 위해 root 권한
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      # ─────────────────────────────────────────────
      # 0) 소스 코드 체크아웃
      # ─────────────────────────────────────────────
      - checkout

      # ─────────────────────────────────────────────
      # 1) 호스트 의존 패키지 설치
      # ─────────────────────────────────────────────
      - run:
          name: Install build prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl lz4 cpio flex bison zstd rsync \
              libncurses-dev libssl-dev python-is-python3 \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi  binutils-arm-linux-gnueabi

      # ─────────────────────────────────────────────
      # 2) Neutron‑Clang (glibc 패치 포함) 설치
      # ─────────────────────────────────────────────
      - run:
          name: Fetch Neutron‑Clang toolchain
          command: |
            set -eux
            TC_DIR="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC_DIR" && cd "$TC_DIR"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable          # 툴체인 자체 다운로드
            ./antman --patch=glibc      # glibc 2.38 portable 패치
            # PATH 등록 (이후 step 에서 source 로 불러옴)
            echo "export PATH=$TC_DIR/bin:\$PATH" >> "$BASH_ENV"

      # ─────────────────────────────────────────────
      # 3) 커널 빌드
      # ─────────────────────────────────────────────
      - run:
          name: Build Galaxy S20+ (y2q) kernel
          command: |
            set -eux
            source "$BASH_ENV"

            # ── 공통 변수 ────────────────────────
            export OUT=$PWD/out
            export ARCH=arm64
            export LLVM=1
            export LLVM_IAS=1
            export CC=clang
            export LD=ld.lld
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

            # ── 0) 클린 빌드 준비 ────────────────
            make O=$OUT mrproper
            make O=$OUT clean

            # ── 1) defconfig ─────────────────────
            make O=$OUT \
                 ARCH=$ARCH LLVM=$LLVM LLVM_IAS=$LLVM_IAS \
                 CC=$CC LD=$LD \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
                 vendor/y2q_kor_singlex_defconfig

            # ── 2) 실제 컴파일 ───────────────────
            make -j"$(nproc)" O=$OUT \
                 ARCH=$ARCH LLVM=$LLVM LLVM_IAS=$LLVM_IAS \
                 CC=$CC LD=$LD \
                 AR=llvm-ar NM=llvm-nm \
                 OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
                 HOSTCC=gcc HOSTCXX=g++

      # ─────────────────────────────────────────────
      # 4) 산출물 저장
      # ─────────────────────────────────────────────
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
