…처럼 **변수는 *환경* 대신 `make` 호출‑한‑줄에만** 넣어 주세요. (`gcc‑version.sh`가 `$CC` 문자열을 파싱할 때 공백·콜론을 오동작함) | `export CC=clang` 등 환경에 남기지 말고, 아래 예시처럼 `make … CC=clang …` 형식으로만 전달 |
| **`python` 누락** | 우분투 20.04 기본 이미지는 `python` 심볼릭 링크가 없음.<br>패키지 `python-is-python3` 또는 `python3` 를 설치하고, 필요하면 `ln -s` 로 `/usr/bin/python` 생성 | 이미 apt 단계에 추가된 상태이므로 더 이상 에러가 없어야 합니다. |
| **Kconfig 대화 프롬프트 제거** | `make olddefconfig` → `make -j$(nproc)` 순서만 사용.<br>혹시 또 멈추면: `yes "" | make olddefconfig` | CI 환경에서는 대화 입력이 불가하므로 반드시 **silent** 방식 사용 |

---

## CircleCI `config.yml` 최종 예시

```yaml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable     # Ubuntu 20.04
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # 1) 필수 패키지
      - run:
          name: Install prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python-is-python3 lz4 cpio flex bison zstd \
              libncurses-dev libssl-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      # 2) Neutron‑Clang + portable glibc
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC_DIR=$HOME/toolchains/neutron-clang
            mkdir -p "$TC_DIR" && cd "$TC_DIR"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc     # GLIBC 2.38
            echo "export PATH=$TC_DIR/bin:\$PATH" >> $BASH_ENV

      # 3) Build kernel
      - run:
          name: Build Galaxy S20+ kernel
          command: |
            set -eux
            source $BASH_ENV

            OUT=$PWD/out
            MAKE_FLAGS="O=$OUT ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                        CC=clang LD=ld.lld \
                        CROSS_COMPILE=aarch64-linux-gnu- \
                        CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                        AS=aarch64-linux-gnu-as \
                        HOSTCC=gcc HOSTCXX=g++"

            # 깨끗한 빌드 디렉터리
            make $MAKE_FLAGS mrproper
            make $MAKE_FLAGS vendor/y2q_kor_singlex_defconfig
            make -j$(nproc) $MAKE_FLAGS

      # 4) Artefact
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
