version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # 1. 필수 패키지
      - run:
          name: Install build prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python3 lz4 cpio flex bison zstd rsync \
              libncurses-dev libssl-dev

      # 2. Neutron‑Clang + GLIBC 패치
      - run:
          name: Fetch Neutron‑Clang (with portable glibc)
          command: |
            set -eux
            TC=$HOME/toolchains/neutron-clang
            echo "export PATH=$TC/bin:$PATH" >> $BASH_ENV
            mkdir -p "$TC" && cd "$TC"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo 'export PATH=$HOME/toolchains/neutron-clang/bin:$PATH' >> "$BASH_ENV"

      # 3. 커널 빌드
      - run:
          name: Build Galaxy S20+ (y2q) kernel
          command: |
            set -eux
            source "$BASH_ENV"

            # ① host 단계: PATH 건드리지 않음
            OUT=$PWD/out
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

            make O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 vendor/y2q_kor_singlex_defconfig

            # ② full build: 이때만 cross binutils 앞에 추가
            export PATH="/usr/aarch64-linux-gnu/bin:$PATH"

            make -j$(nproc) O=$OUT \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
                 CROSS_COMPILE=$CROSS_COMPILE \
                 CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT \
                 HOSTCC=gcc HOSTCXX=g++

      # 4. 결과물 저장
      - store_artifacts:
          path:     out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel


