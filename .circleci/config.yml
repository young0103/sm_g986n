# .circleci/config.yml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
        user: root                    # apt 를 root 로 직접 실행
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ:   Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ─────────────────────────────────────────────────────────────
      # 1. 필수 패키지
      # ─────────────────────────────────────────────────────────────
      - run:
          name: Install build prerequisites
          command: |
            apt-get update
            apt-get install -y \
              build-essential bc git curl python3 lz4 cpio flex bison zstd rsync \
              libncurses-dev libssl-dev \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              binutils-arm-linux-gnueabi

      # ─────────────────────────────────────────────────────────────
      # 2. Neutron‑Clang + GLIBC patch (antman)
      # ─────────────────────────────────────────────────────────────
      - run:
          name: Fetch toolchain & portable GLIBC
          command: |
            set -eux
            TC_DIR="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC_DIR" && cd "$TC_DIR"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable          # 본체
            ./antman --patch=glibc      # libc 2.38 포팅
            echo 'export PATH=$HOME/toolchains/neutron-clang/bin:$PATH' >> "$BASH_ENV"

      # ─────────────────────────────────────────────────────────────
      # 3. 커널  빌드  (변수는 ★반드시★ make 명령행에 직접 전달)
      # ─────────────────────────────────────────────────────────────
      - run:
          name: Build y2q kernel
          command: |
            set -eux
            source "$BASH_ENV"
            OUT=$PWD/out
      
            # ① defconfig
            make -C $PWD O="$OUT" \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 vendor/y2q_kor_singlex_defconfig
      
            # ② 전체 빌드
            make -C $PWD -j"$(nproc)" O="$OUT" \
                 ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 HOSTCC=gcc HOSTCXX=g++

      # ─────────────────────────────────────────────────────────────
      # 4. 결과물  보존
      # ─────────────────────────────────────────────────────────────
      - store_artifacts:
          path:     out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel


