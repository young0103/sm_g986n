# .circleci/config.yml (요약)
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable          # Ubuntu 20.04
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout
      - run: |
          apt-get update -y
          apt-get install -y \
            build-essential bc git curl python-is-python3 \
            lz4 cpio flex bison zstd \
            libncurses-dev libssl-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - run: |
          set -eux
          TC=$HOME/toolchains/neutron-clang
          mkdir -p "$TC" && cd "$TC"
          curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          ./antman -S stable
          ./antman --patch=glibc
          echo "export PATH=$TC/bin:\$PATH" >> "$BASH_ENV"
      - run: |
          set -eux
          source "$BASH_ENV"
          OUT=$PWD/out
          NPROC=$(nproc)

          # ① defconfig
          make O=$OUT \
               ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CC=clang LD=ld.lld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               vendor/y2q_kor_singlex_defconfig

          # ② 전체 빌드
          make -j$NPROC O=$OUT \
               ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CC=clang LD=ld.lld \
               CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCC=gcc HOSTCXX=g++

      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
