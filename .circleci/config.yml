version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable   # 그대로 사용
        user: root                # ← apt 를 바로 실행하기 위해 root 로
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # 1) 필수 패키지 설치 (sudo 불필요)
      - run:
          name: Install build prerequisites
          command: |
            apt-get update
            apt-get install -y build-essential bc git curl python3 lz4 cpio flex bison \
                               zstd rsync libncurses-dev libssl-dev elfutils-libelf-dev

      # 2) Neutron‑Clang + glibc 패치
      - run:
          name: Fetch toolchain & add portable GLIBC
          command: |
            set -eux
            TC=$HOME/toolchains/neutron-clang
            mkdir -p "$TC" && cd "$TC"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable              # 툴체인 본체
            ./antman --patch=glibc          # ★ GLIBC 2.38 포팅
            echo 'export PATH=$HOME/toolchains/neutron-clang/bin:$PATH' >> $BASH_ENV

      # 3) 커널 빌드 (한 줄 export → 한 줄 make)
      - run:
          name: Build y2q kernel
          command: |
            set -eux
            source $BASH_ENV
            OUT=$PWD/out
            make O=$OUT ARCH=arm64 LLVM=1 CC=clang \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                 vendor/y2q_kor_singlex_defconfig
            make  -j"$(nproc)" \
                 O=$OUT ARCH=arm64 LLVM=1 CC=clang \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      # 4) 결과물 보존
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image


workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel

