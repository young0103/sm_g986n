# .circleci/config.yml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable   # Ubuntu 20.04 기반
        user: root                # sudo 없이 apt 사용
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ────────────────────────────────────────────────
      # 1. 필수 패키지 설치
      # ────────────────────────────────────────────────
      - run:
          name: Install build prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl python3 python-is-python3 \
              lz4 cpio flex bison zstd rsync                   \
              libncurses-dev libssl-dev                       \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi  binutils-arm-linux-gnueabi

      # ────────────────────────────────────────────────
      # 2. Neutron‑Clang 내려받고 glibc 패치
      # ────────────────────────────────────────────────
      - run:
          name: Fetch Neutron‑Clang (+ portable glibc)
          command: |
            set -eux
            TC=$HOME/toolchains/neutron-clang
            mkdir -p "$TC" && cd "$TC"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable          # toolchain 본체
            ./antman --patch=glibc      # GLIBC 2.38 런타임 세트
            echo 'export PATH=$HOME/toolchains/neutron-clang/bin:$PATH' >> "$BASH_ENV"

      # ────────────────────────────────────────────────
      # 3. 커널 빌드  (defconfig → full build)
      # ────────────────────────────────────────────────
      - run:
          name: Build Galaxy S20+ (y2q) kernel
          command: |
            set -eux
            source "$BASH_ENV"

            OUT=$PWD/out
            export ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            export HOSTCC=gcc HOSTCXX=g++

            # ① defconfig
            make O="$OUT" \
                 vendor/y2q_kor_singlex_defconfig

            # ② full build  (olddefconfig 단계 제거)
            make -j"$(nproc)" O="$OUT"

      # ────────────────────────────────────────────────
      # 4. 결과물 보존
      # ────────────────────────────────────────────────
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
