version: 2.1

executors:
  kernel-exec:
    docker: [ { image: ubuntu:24.04 } ]
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # 1. 설치
      - run:
          name: Install prerequisites
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential bc git curl python3 lz4 cpio flex bison \
                                     zstd rsync libncurses-dev libssl-dev elfutils-libelf-dev

      # 2. Neutron‑Clang 18
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC_DIR=$HOME/toolchains/neutron-clang
            mkdir -p "$TC_DIR" && cd "$TC_DIR"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            echo 'export PATH=$HOME/toolchains/neutron-clang/bin:$PATH' >> $BASH_ENV

      # 3. 빌드
      - run:
          name: Build Samsung SM‑G986N (y2q) kernel
          command: |
            set -eux
            source $BASH_ENV
            export ARCH=arm64 LLVM=1
            export CC=clang
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            OUT=$PWD/out
            mkdir -p "$OUT"
            make O=$OUT vendor/y2q_kor_singlex_defconfig
            make -j"$(nproc)" O=$OUT

      # 4. 결과 저장
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
