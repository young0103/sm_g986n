version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ───────────────────────── 1. 의존 패키지 ─────────────────────────
      - run:
          name: Install prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc git curl lz4 cpio flex bison zstd rsync \
              libncurses-dev libssl-dev python-is-python3 \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      # ───────────────── 2. Neutron‑Clang + 휴대용 GLIBC ────────────────
      - run:
          name: Fetch Neutron‑Clang
          command: |
            set -eux
            TC="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC" && cd "$TC"
            curl -sLo antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc
            echo "export PATH=$TC/bin:\$PATH" >> "$BASH_ENV"

      # ───────────────────── 3. 커널 빌드 (one‑shot) ─────────────────────
      - run:
          name: Build y2q kernel
          command: |
            set -eux
            source "$BASH_ENV"

            # sanity check – cross‑gcc 존재 여부
            which aarch64-linux-gnu-gcc
            which arm-linux-gnueabi-gcc

            OUT=$PWD/out
            make O=$OUT ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC=clang LD=ld.lld \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                 vendor/y2q_kor_singlex_defconfig

            make -j"$(nproc)" O=$OUT ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                 CC=clang LD=ld.lld \
                 CROSS_COMPILE=aarch64-linux-gnu- \
                 CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                 HOSTCC=gcc HOSTCXX=g++

      # ───────────────────────── 4. 결과물 ─────────────────────────────
      - store_artifacts:
          path: out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
