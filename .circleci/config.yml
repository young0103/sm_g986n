# .circleci/config.yml
version: 2.1

executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable        # Ubuntu 20.04 LTS
        user: root
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      - checkout

      # ─────────────────────────────── 1. 필수 패키지 ───────────────────────────────
      - run:
          name: Install build prerequisites
          command: |
            apt-get update -y
            apt-get install -y \
              build-essential bc curl git python-is-python3 \
              lz4 cpio flex bison zstd \
              libncurses-dev libssl-dev \
              gcc-aarch64-linux-gnu  binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi  binutils-arm-linux-gnueabi

      # ─────────────────────────────── 2. Neutron‑Clang ───────────────────────────────
      - run:
          name: Fetch Neutron‑Clang (with portable glibc 2.38)
          command: |
            set -eux
            TC="$HOME/toolchains/neutron-clang"
            mkdir -p "$TC" && cd "$TC"
            curl -sL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S stable
            ./antman --patch=glibc              # glibc 2.38 포함
            echo "export PATH=$TC/bin:\$PATH" >> "$BASH_ENV"

      # ─────────────────────────────── 3. 커널 빌드 ───────────────────────────────
      - run:
          name: Build Galaxy S20+ (y2q) kernel
          command: |
            set -eux
            source "$BASH_ENV"

            OUT="$PWD/out"

            # Make 에 건네줄 공통 플래그(한 줄 선언 방식만 사용)
            MF="O=$OUT ARCH=arm64 LLVM=1 LLVM_IAS=1 \
                CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                AS=aarch64-linux-gnu-as \
                HOSTCC=gcc HOSTCXX=g++"

            # ① 깨끗한 작업 디렉터리
            make $MF mrproper

            # ② defconfig
            make $MF vendor/y2q_kor_singlex_defconfig

            # ③ 풀 빌드
            make -j"$(nproc)" $MF

      # ─────────────────────────────── 4. 결과물 보존 ───────────────────────────────
      - store_artifacts:
          path:       out/arch/arm64/boot/Image.gz-dtb
          destination: kernel-image

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel
