# ====================================================================
#  Samsung Galaxy S20+ (SM‑G986N) 커널 — Neutron 18 자동 빌드 파이프라인
# ====================================================================

version: 2.1

# ---------- 공통 docker 실행환경 ----------
executors:
  kernel-exec:
    docker:
      - image: cimg/base:stable          # Ubuntu 22.04 기반
    environment:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

# ---------- 빌드 Job ----------
jobs:
  build-kernel:
    executor: kernel-exec
    steps:
      # 0) 체크아웃
      - checkout

      # 1) 의존 패키지 설치
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              build-essential bc bison flex git libssl-dev \
              libelf-dev cpio perl python3 lz4 curl zip jq

      # 2) Toolchain 다운로드 (Neutron Clang 18 + Linaro GCC 13)
      - run:
          name: Fetch toolchains
          command: |
            mkdir -p toolchain
            curl -L https://github.com/Neutron-Toolchains/clang-build/releases/download/18.0.2/neutron-clang-18.0.2.tar.xz \
              | tar -xJ -C toolchain
            curl -L https://releases.linaro.org/components/toolchain/binaries/latest-13/aarch64-linux-gnu/gcc-linaro-13.2.0-2023.10-x86_64_aarch64-linux-gnu.tar.xz \
              | tar -xJ -C toolchain

      # 3) 커널 소스 클론  (★ 여기 URL에 자신의 repo 주소를 넣어 두면 그대로 사용)
      - run:
          name: Clone kernel source
          command: |
            git clone --depth=1 https://github.com/young0103/sm_g986n.git kernel

      # 4) (선택) SEC_MM 등 불필요한 메뉴/누락 Kconfig 우회 — 기존 워크플로 반영
      - run:
          name: Patch Samsung extra menus & dummy Kconfig
          command: |
            cd kernel
            # python2 print → python3
            sed -i 's/print >> sys.stderr, \(.*\)/print(\1, file=sys.stderr)/' scripts/gcc-wrapper.py || true
            # 주석 처리
            sed -i '/^menu "Samsung Secure Memory/,/^endmenu/ s/^/# /' mm/Kconfig
            # 더미 Kconfig 생성
            make_dummy () { f=$1 sym=$2; [ -f "$f" ] && return; mkdir -p "$(dirname "$f")"; printf 'config %s\n\tbool\n' "$sym" >"$f"; }
            make_dummy mm/sec_mm/Kconfig SEC_MM
            make_dummy drivers/misc/drb/Kconfig MISC_DRB_DUMMY

      # 5) 커널 빌드
      - run:
          name: Build kernel (Neutron 18)
          command: |
            set -e
            cd kernel
            export ARCH=arm64 SRCARCH=arm64
            export CC=$(pwd)/../toolchain/neutron-clang-18.0.2/bin/clang
            export LLVM=1
            export CROSS_COMPILE=$(pwd)/../toolchain/gcc-linaro-13.2.0-2023.10-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-
            export CROSS_COMPILE_COMPAT=$(pwd)/../toolchain/gcc-linaro-13.2.0-2023.10-x86_64_aarch64-linux-gnu/bin/arm-linux-gnueabi-
            export PATH=$(dirname "$CC"):$PATH

            # ★ 단말 defconfig — S20+ KOR One UI 5   (필요시 변경)
            cp arch/arm64/configs/y2q_kor_singlex_defconfig .config
            scripts/kconfig/conf --olddefconfig Kconfig

            make -j$(nproc)

      # 6) 결과물 아티팩트 업로드
      - store_artifacts:
          path: kernel/arch/arm64/boot
          destination: kernel_out

workflows:
  version: 2
  build-and-store:
    jobs:
      - build-kernel